name: Learning content problem
description: Report an inaccurate, unclear, unsafe, or broken learning document
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: |
        This repository teaches multi-agent orchestration from historical evidence. Do not report OpenRig runtime or installation problems here. Remove credentials, private prompts, personal details, and private paths before submitting public evidence.
  - type: input
    id: page
    attributes:
      label: Affected document
      description: Give the repository-relative path or public URL.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong or unclear?
      description: Describe the observed wording, link, exercise, or evidence problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected learning outcome
      description: Explain what a reader should be able to understand or verify instead.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Supporting evidence
      description: Cite public, redacted evidence. Do not run the archived implementation.

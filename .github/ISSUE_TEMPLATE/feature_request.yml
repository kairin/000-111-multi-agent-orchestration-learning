name: Learning exercise proposal
description: Propose a bounded improvement to the orchestration curriculum
labels: ["enhancement", "documentation"]
body:
  - type: textarea
    id: outcome
    attributes:
      label: Learning outcome
      description: State the skill a reader should gain.
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: Bounded input
      description: Name the documents or historical evidence the exercise would use.
    validations:
      required: true
  - type: textarea
    id: artifact
    attributes:
      label: Expected artifact and completion check
      description: Name the paper artifact and the checkable condition that completes it.
    validations:
      required: true
  - type: textarea
    id: exclusions
    attributes:
      label: Exclusions and stop point
      description: State what is outside scope and when the exercise must stop or escalate.
    validations:
      required: true
